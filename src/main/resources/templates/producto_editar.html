<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}" th:with="pageTitle='Editar Producto - Garritas Veterinaria'"></th:block>
    <link rel="stylesheet" href="/static/css/theme.css"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Editar Producto</h1>
                <p class="text-muted">Modifica los datos del producto</p>
            </div>
            <div>
                <a class="btn btn-secondary" href="/inventario">
                    <i class="fas fa-arrow-left me-2"></i>Volver
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/inventario/{id}/editar(id=${producto.id})}" method="post" th:object="${producto}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Código</label>
                            <input type="text" class="form-control" th:value="${producto.id}" readonly />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required />
                        </div>
                        <div class="col-12">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" th:field="*{categoria}">
                                <option value="">Sin categoría</option>
                                <option value="MEDICAMENTO">Medicamento</option>
                                <option value="VACUNA">Vacuna</option>
                                <option value="ALIMENTO">Alimento</option>
                                <option value="ACCESORIO">Accesorio</option>
                                <option value="HIGIENE">Higiene</option>
                                <option value="INSTRUMENTAL">Instrumental</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Stock</label>
                            <input type="number" class="form-control" th:field="*{stock}" min="0" />
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Stock Mínimo</label>
                            <input type="number" class="form-control" th:field="*{stockMinimo}" min="0" />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Precio</label>
                            <input type="number" class="form-control" th:field="*{precio}" step="0.01" min="0" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Proveedor</label>
                            <input type="text" class="form-control" th:field="*{proveedor}" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha de Vencimiento</label>
                            <input type="date" class="form-control" th:field="*{fechaVencimiento}" />
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:field="*{activo}" />
                                <label class="form-check-label">Producto activo</label>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 d-flex justify-content-end gap-2">
                        <a class="btn btn-secondary" href="/inventario">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/toasts :: toasts}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
