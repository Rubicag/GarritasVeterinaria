<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}" th:with="pageTitle='Mi Perfil - Garritas Veterinaria'"></th:block>
    <link rel="stylesheet" href="/static/css/theme.css"/>
</head>
<body class="bg-light">
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0"><i class="fas fa-user me-2"></i>Mi Perfil</h5>
            </div>
            <div class="card-body">
                <div th:if="${usuario != null}">
                    <p>Nombre: <strong th:text="${usuario.nombre}">Nombre</strong> <span th:text="${usuario.apellido}">Apellido</span></p>
                    <p>Correo: <strong th:text="${usuario.correo}">correo@ejemplo.com</strong></p>
                    <p>Usuario: <strong th:text="${usuario.usuario}">usuario</strong></p>
                    <p>Rol: <strong th:text="${usuario.rol != null ? usuario.rol.nombre : 'N/A'}">ROL</strong></p>
                </div>
                <div th:unless="${usuario != null}">
                    <p th:if="${username}">Usuario: <strong th:text="${username}">usuario</strong></p>
                    <p th:unless="${username}">No hay usuario autenticado.</p>
                </div>

                <a class="btn btn-primary" th:href="@{/usuarios}"><i class="fas fa-arrow-left me-1"></i> Volver a Usuarios</a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/toasts :: toasts}"></div>
    <div th:replace="~{fragments/modals :: modals}"></div>
</body>
</html>
