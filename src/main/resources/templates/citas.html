<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <th:block th:replace="~{fragments/head :: head}" th:with="pageTitle='Citas - Garritas Veterinaria'"></th:block>
        <link rel="stylesheet" href="/static/css/theme.css"/>
    </head>
    <body class="bg-light">
    <!-- Header (fragment) -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container py-4">
        <h1 class="mb-4">Citas</h1>

        <div class="row">
            <div class="col-md-6">
                <h3>Nueva cita</h3>
                
                <!-- Mensajes de éxito o error -->
                <div th:if="${param.success}" class="alert alert-success">
                    Cita creada exitosamente
                </div>
                <div th:if="${param.error}" class="alert alert-danger">
                    Error: <span th:text="${param.error}"></span>
                </div>
                
                <form id="citaForm" th:action="@{/citas}" method="post">
                    <!-- Token CSRF requerido por Spring Security -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <div class="mb-3">
                        <label class="form-label">Mascota</label>
                        <select class="form-select" name="mascotaId" required>
                            <option value="">Seleccionar mascota...</option>
                            <option th:each="m : ${mascotas}" th:value="${m.id}" th:text="${m.nombre + ' (' + m.especie + ')'}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Veterinario</label>
                        <select class="form-select" name="veterinarioId" required>
                            <option value="">Seleccionar veterinario...</option>
                            <option th:each="v : ${veterinarios}" th:value="${v.id}" 
                                    th:text="${v.nombre + ' ' + v.apellido}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Servicio</label>
                        <select class="form-select" name="servicioId" required>
                            <option value="">Seleccionar servicio...</option>
                            <option th:each="s : ${servicios}" th:value="${s.id}" th:text="${s.nombre + ' - $' + s.precio}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Fecha y hora</label>
                        <input class="form-control" type="datetime-local" name="fecha" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Observaciones</label>
                        <textarea class="form-control" name="observaciones" rows="3"></textarea>
                    </div>
                    <button class="btn btn-primary" type="submit">Crear cita</button>
                    <button class="btn btn-secondary" type="button" id="btnRecargarCitas">Recargar con API</button>
                </form>
            </div>

            <div class="col-md-6">
                <h3>Listado de citas</h3>
                
                <!-- Filtros de búsqueda SERVER-SIDE -->
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 class="card-title">🔍 Filtros de Búsqueda</h6>
                        <form method="get" action="/citas">
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label class="form-label">Fecha desde</label>
                                    <input type="date" name="fechaDesde" class="form-control form-control-sm" 
                                           th:value="${filtroFechaDesde}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Fecha hasta</label>
                                    <input type="date" name="fechaHasta" class="form-control form-control-sm" 
                                           th:value="${filtroFechaHasta}">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Estado</label>
                                    <select name="estado" class="form-select form-select-sm">
                                        <option value="">Todos</option>
                                        <option value="Pendiente" th:selected="${filtroEstado == 'Pendiente'}">Pendiente</option>
                                        <option value="Atendida" th:selected="${filtroEstado == 'Atendida'}">Atendida</option>
                                        <option value="Cancelada" th:selected="${filtroEstado == 'Cancelada'}">Cancelada</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Veterinario</label>
                                    <select name="veterinarioId" class="form-select form-select-sm">
                                        <option value="">Todos</option>
                                        <option th:each="v : ${veterinarios}" 
                                                th:value="${v.id}" 
                                                th:selected="${filtroVeterinarioId == v.id}"
                                                th:text="${v.nombre + ' ' + v.apellido}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Mascota</label>
                                    <select name="mascotaId" class="form-select form-select-sm">
                                        <option value="">Todas</option>
                                        <option th:each="m : ${mascotas}" 
                                                th:value="${m.id}" 
                                                th:selected="${filtroMascotaId == m.id}"
                                                th:text="${m.nombre}"></option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-sm btn-primary">
                                        🔍 Aplicar Filtros
                                    </button>
                                    <a href="/citas" class="btn btn-sm btn-secondary">
                                        🔄 Limpiar
                                    </a>
                                    <span class="text-muted ms-2">
                                        <small>Total: <strong th:text="${citasPage.totalElements}">0</strong> citas</small>
                                    </span>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                
                <table class="table table-striped table-sm" id="citasTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Mascota</th>
                            <th>Veterinario</th>
                            <th>Servicio</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${citasPage.content}">
                            <td th:text="${c.id}"></td>
                            <td th:text="${c.mascota?.nombre ?: 'No disponible'}"></td>
                            <td th:text="${(c.veterinario?.nombre ?: 'Sin asignar') + ' ' + (c.veterinario?.apellido ?: '')}"></td>
                            <td th:text="${c.servicio?.nombre ?: 'No disponible'}"></td>
                            <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${c.estado.name() == 'Pendiente'} ? 'bg-warning' : (${c.estado.name() == 'Atendida'} ? 'bg-success' : 'bg-danger')"
                                      th:text="${c.estado}"></span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-success btn-accion" th:attr="data-id=${c.id}" data-action="confirmar">
                                    Confirmar
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${citasPage.totalElements == 0}">
                            <td colspan="7" class="text-center text-muted">
                                No hay citas que mostrar
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <!-- Controles de paginación -->
                <nav th:if="${citasPage.totalPages > 1}">
                    <ul class="pagination pagination-sm justify-content-center">
                        <!-- Botón anterior -->
                        <li class="page-item" th:classappend="${citasPage.first} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/citas(page=${citasPage.number - 1}, size=${citasPage.size}, 
                                       fechaDesde=${filtroFechaDesde}, fechaHasta=${filtroFechaHasta}, 
                                       estado=${filtroEstado}, veterinarioId=${filtroVeterinarioId}, 
                                       mascotaId=${filtroMascotaId})}">
                                Anterior
                            </a>
                        </li>
                        
                        <!-- Números de página -->
                        <li class="page-item" 
                            th:each="i : ${#numbers.sequence(0, citasPage.totalPages - 1)}"
                            th:if="${i >= citasPage.number - 2 and i <= citasPage.number + 2}"
                            th:classappend="${i == citasPage.number} ? 'active'">
                            <a class="page-link" 
                               th:href="@{/citas(page=${i}, size=${citasPage.size}, 
                                       fechaDesde=${filtroFechaDesde}, fechaHasta=${filtroFechaHasta}, 
                                       estado=${filtroEstado}, veterinarioId=${filtroVeterinarioId}, 
                                       mascotaId=${filtroMascotaId})}"
                               th:text="${i + 1}">1</a>
                        </li>
                        
                        <!-- Botón siguiente -->
                        <li class="page-item" th:classappend="${citasPage.last} ? 'disabled'">
                            <a class="page-link" 
                               th:href="@{/citas(page=${citasPage.number + 1}, size=${citasPage.size}, 
                                       fechaDesde=${filtroFechaDesde}, fechaHasta=${filtroFechaHasta}, 
                                       estado=${filtroEstado}, veterinarioId=${filtroVeterinarioId}, 
                                       mascotaId=${filtroMascotaId})}">
                                Siguiente
                            </a>
                        </li>
                    </ul>
                    <p class="text-center text-muted">
                        <small>
                            Página <strong th:text="${citasPage.number + 1}">1</strong> de 
                            <strong th:text="${citasPage.totalPages}">1</strong>
                            (mostrando <strong th:text="${citasPage.numberOfElements}">0</strong> de 
                            <strong th:text="${citasPage.totalElements}">0</strong>)
                        </small>
                    </p>
                </nav>
            </div>
        </div>

        <!-- JavaScript para mejorar la interactividad -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="/static/js/ui.js"></script>
        <script th:inline="javascript">
            // Obtener token CSRF para peticiones AJAX
            const csrfToken = /*[[${_csrf.token}]]*/ '';
            const csrfHeader = /*[[${_csrf.headerName}]]*/ '';
            
            // Cargar citas usando API REST
            async function cargarCitasAPI() {
                try {
                    const response = await fetch('/api/citas');
                    const citas = await response.json();
                    
                    const tbody = document.querySelector('#citasTable tbody');
                    tbody.innerHTML = '';
                    
                        citas.forEach(cita => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${cita.id}</td>
                            <td>${cita.mascota?.nombre || 'No disponible'}</td>
                            <td>${cita.veterinario?.nombre || 'Sin asignar'} ${cita.veterinario?.apellido || ''}</td>
                            <td>${cita.servicio?.nombre || 'No disponible'}</td>
                            <td>${new Date(cita.fecha).toLocaleString()}</td>
                            <td>${cita.observaciones || ''}</td>
                                <td>
                                <button class="btn btn-sm btn-success btn-accion" data-id="${cita.id}" data-action="confirmar">
                                    Confirmar
                                </button>
                                </td>
                        `;
                        tbody.appendChild(row);
                    });
                } catch (error) {
                    console.error('Error al cargar citas:', error);
                    alert('Error al cargar las citas');
                }
            }
            
            // Confirmar cita
            async function confirmarCita(citaId) {
                try {
                    const response = await fetch(`/api/citas/${citaId}/confirmar`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            [csrfHeader]: csrfToken
                        }
                    });
                    
                    if (response.ok) {
                        alert('Cita confirmada exitosamente');
                        cargarCitasAPI();
                    } else {
                        alert('Error al confirmar la cita');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error al confirmar la cita');
                }
            }
            // Registrar acción confirmar en el registry global (variantes de nombre)
            if (typeof registerAction === 'function') {
                try {
                    registerAction('confirmar', confirmarCita);
                    registerAction('confirmarcita', confirmarCita);
                    registerAction('confirmarCita', confirmarCita);
                } catch(e){ console.warn('Registro confirmar falló', e); }
            }
            
            // Crear cita usando API
            document.getElementById('citaForm').addEventListener('submit', async function(e) {
                const useAPI = confirm('¿Desea crear la cita usando la API REST?');
                
                if (useAPI) {
                    e.preventDefault();
                    
                    const formData = new FormData(this);
                    const citaData = {
                        mascotaId: formData.get('mascotaId'),
                        servicioId: formData.get('servicioId'),
                        fecha: formData.get('fecha'),
                        observaciones: formData.get('observaciones')
                    };
                    
                    try {
                        const response = await fetch('/api/citas', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                [csrfHeader]: csrfToken
                            },
                            body: JSON.stringify(citaData)
                        });
                        
                        if (response.ok) {
                            alert('Cita creada exitosamente');
                            this.reset();
                            cargarCitasAPI();
                        } else {
                            const error = await response.json();
                            alert('Error: ' + (error.error || 'Error desconocido'));
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Error al crear la cita');
                    }
                }
            });
        </script>

        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div th:replace="~{fragments/modals :: modals}"></div>

    </div>
    </body>
</html>
