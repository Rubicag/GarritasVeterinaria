<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}" th:with="pageTitle='Mascotas - Garritas Veterinaria'"></th:block>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css" />
    <link rel="stylesheet" href="/static/css/theme.css" />
</head>
<body>
    <!-- Top nav (fragment) -->
    <div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Mascotas</h1>
        <div>
            <a class="btn btn-primary" href="/mascotas/nueva">Nueva Mascota</a>
        </div>
    </div>

    <p class="text-muted">Listado de mascotas registradas en el sistema</p>

    <div class="table-responsive">
        <table id="mascotasTable" class="table table-striped table-bordered display nowrap" style="width:100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Especie</th>
                    <th>Raza</th>
                    <th>Sexo</th>
                    <th>Fecha Nac.</th>
                    <th>Peso (kg)</th>
                    <th>Edad</th>
                    <th>Propietario</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${mascotas}">
                    <td th:text="${m.id}">1</td>
                    <td th:text="${m.nombre}">Fido</td>
                    <td th:text="${m.especie}">Perro</td>
                    <td th:text="${m.raza}">Labrador</td>
                    <td th:text="${m.sexo != null ? m.sexo : 'N/A'}">Macho</td>
                    <td th:text="${m.fechaNacimiento != null ? #temporals.format(m.fechaNacimiento, 'dd/MM/yyyy') : 'N/A'}">10/03/2021</td>
                    <td th:text="${m.peso != null ? #numbers.formatDecimal(m.peso, 2, 2) : 'N/A'}">12.50</td>
                    <td th:text="${m.edad != null ? m.edad : (m.fechaNacimiento != null ? T(java.time.Period).between(m.fechaNacimiento, T(java.time.LocalDate).now()).getYears() : 'N/A')}">3</td>
                    <td th:text="${m.propietario != null ? m.propietario.nombre : 'N/A'}">Juan</td>
                </tr>
            </tbody>
        </table>
    </div>

    <a class="btn btn-secondary mt-3" href="/dashboard">Volver al dashboard</a>
</div>

<!-- Dependencias JS: jQuery, DataTables y plugins -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/ui.js"></script>

<!-- Inicialización de DataTables: evitar inlining de Thymeleaf al usar literales JS con corchetes -->
<script th:inline="none">
$(document).ready(function() {
    $('#mascotasTable').DataTable({
        responsive: true,
        pageLength: 10,
        lengthMenu: [Array.of(10,25,50,-1), Array.of(10,25,50,'Todos')],
        ordering: true,
        order: [[0, 'desc']],
        language: {
            url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
        }
    });
});
</script>
</script>

    <div th:replace="~{fragments/toasts :: toasts}"></div>
    <div th:replace="~{fragments/modals :: modals}"></div>

</body>
</html>
