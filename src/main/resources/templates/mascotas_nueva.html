<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}" th:with="pageTitle='Nueva Mascota - Garritas Veterinaria'"></th:block>
    <link rel="stylesheet" href="/static/css/theme.css" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container app-container mt-4">
    <div class="row">
        <div class="col-md-8">
            <h3 class="mb-3">Registrar Nueva Mascota</h3>
            <p class="text-muted">Completa los datos de la mascota y asigna un propietario.</p>

            <div th:if="${error}" class="alert alert-danger"> <span th:text="${error}"></span> </div>
            <div th:if="${success}" class="alert alert-success"> <span th:text="${success}"></span> </div>

            <!-- Mostrar alerta si no hay propietarios disponibles -->
            <div th:if="${#lists.isEmpty(propietarios)}" class="alert alert-warning">
                No hay propietarios disponibles. <a th:href="@{/usuarios}" class="alert-link">Crear propietario</a> o asigna uno antes de crear la mascota.
            </div>

            <form th:action="@{/mascotas}" method="post" th:object="${mascota}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre de la mascota" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Especie</label>
                    <input type="text" th:field="*{especie}" class="form-control" placeholder="Canino, Felino, etc." required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Raza</label>
                    <input type="text" th:field="*{raza}" class="form-control" placeholder="Ej. Labrador, Persa" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Sexo</label>
                    <select th:field="*{sexo}" class="form-select" required>
                        <option th:each="s : ${sexos}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de Nacimiento</label>
                    <input type="date" th:field="*{fechaNacimiento}" class="form-control" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Peso (kg)</label>
                    <input type="number" step="0.01" th:field="*{peso}" class="form-control" />
                </div>

                <div class="mb-3">
                    <label class="form-label">Propietario</label>
                    <select name="propietarioId" class="form-select" th:attr="required=${!#lists.isEmpty(propietarios)} ? 'required' : null" th:disabled="${#lists.isEmpty(propietarios)}">
                        <option value="" disabled selected th:if="${!#lists.isEmpty(propietarios)}">Selecciona un propietario</option>
                        <option th:each="u : ${propietarios}" th:value="${u.id}" th:text="${u.nombre} + ' ' + ${u.apellido} + ' (' + ${u.usuario} + ')' "></option>
                    </select>
                    <div th:if="${#lists.isEmpty(propietarios)}" class="form-text text-muted">No hay propietarios registrados. Ve a Usuarios → Nuevo para crear un propietario.</div>
                </div>

                <div class="d-flex gap-2">
                    <a th:href="@{/mascotas}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary" th:disabled="${#lists.isEmpty(propietarios)}">Guardar mascota</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <div th:replace="~{fragments/toasts :: toasts}"></div>
    <div th:replace="~{fragments/modals :: modals}"></div>

</body>
</html>
