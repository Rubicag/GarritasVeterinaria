<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}" th:with="pageTitle='Editar Usuario - Garritas Veterinaria'"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
    <h3>Editar Usuario</h3>

    <div th:if="${error}" class="alert alert-danger"> <span th:text="${error}"></span> </div>
    <div th:if="${success}" class="alert alert-success"> <span th:text="${success}"></span> </div>

    <form th:action="@{'/usuarios/' + ${usuario.id} + '/editar'}" th:object="${usuario}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required />
            </div>
            <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input type="text" th:field="*{apellido}" class="form-control" required />
            </div>
            <div class="col-md-4">
                <label class="form-label">DNI</label>
                <input type="text" th:field="*{dni}" class="form-control" />
            </div>
            <div class="col-md-4">
                <label class="form-label">Correo</label>
                <input type="email" th:field="*{correo}" class="form-control" required />
            </div>
            <div class="col-md-4">
                <label class="form-label">Usuario</label>
                <input type="text" th:field="*{usuario}" class="form-control" required />
            </div>
            <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input type="text" th:field="*{telefono}" class="form-control" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Dirección</label>
                <input type="text" th:field="*{direccion}" class="form-control" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Contraseña (dejar en blanco para no cambiar)</label>
                <input type="password" th:field="*{contrasena}" class="form-control" minlength="6" />
            </div>
            <div class="col-md-6">
                <label class="form-label">Rol</label>
                <select class="form-select" name="rol.nombre" th:field="*{rol.nombre}">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${usuario.rol != null && usuario.rol.nombre == r}"></option>
                </select>
            </div>
        </div>
        <div class="mt-3">
            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </div>
    </form>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/toasts :: toasts}"></div>
    <div th:replace="~{fragments/modals :: modals}"></div>
</body>
</html>
