<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head}" th:with="pageTitle='Gestión de Usuarios - Garritas Veterinarias'"></th:block>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.6/css/dataTables.bootstrap5.min.css"/>
    <link rel="stylesheet" href="/static/css/theme.css"/>
</head>
<body class="bg-light">
    <!-- Header (fragment) -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Gestión de Usuarios</h1>
                <p class="text-muted">Administra usuarios del sistema veterinario</p>
            </div>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#nuevoUsuarioModal">
                <i class="fas fa-user-plus me-2"></i>Nuevo Usuario
            </button>
        </div>

        <!-- Mensajes -->
        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${param.success}">Operación exitosa</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-triangle-exclamation me-2"></i>
            <span th:text="${param.error}">Error en la operación</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Filtros -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Buscar Usuario</label>
                        <input type="text" class="form-control" id="buscarUsuario" placeholder="Nombre o email...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Rol</label>
                        <select class="form-select" id="filtroRol">
                            <option value="">Todos los roles</option>
                            <option value="ADMIN">Administrador</option>
                            <option value="VETERINARIO">Veterinario</option>
                            <option value="USER">Usuario</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Estado</label>
                        <select class="form-select" id="filtroEstado">
                            <option value="">Todos los estados</option>
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-outline-secondary d-block w-100" id="btnLimpiarUsuarios" type="button">
                            <i class="fas fa-sync me-1"></i>Limpiar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla de usuarios -->
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">
                    <i class="fas fa-users me-2"></i>Lista de Usuarios
                    <span class="badge bg-secondary ms-2" id="contadorUsuarios">0</span>
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="tablaUsuarios">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Fecha Registro</th>
                                <th>Mascotas</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usuario : ${usuarios}">
                                <td th:text="${usuario.id}">1</td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="avatar-sm bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2">
                                            <i class="fas fa-user"></i>
                                        </div>
                                        <span th:text="${usuario.usuario}">admin</span>
                                    </div>
                                </td>
                                <td th:text="${usuario.correo}">admin@example.com</td>
                                <td>
                                    <span th:class="'badge ' + ${usuario.rol != null and usuario.rol.nombre == 'ADMIN' ? 'bg-danger' : (usuario.rol != null and usuario.rol.nombre == 'VETERINARIO' ? 'bg-info' : 'bg-secondary')}"
                                          th:text="${usuario.rol != null ? usuario.rol.nombre : 'Sin rol'}">ADMIN</span>
                                </td>
                                <td>
                                    <span class="badge bg-success">Activo</span>
                                </td>
                                <td>-</td>
                                <td>
                                    <span class="badge bg-info" th:text="${usuario.mascotas != null ? usuario.mascotas.size() : 0}">0</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <button class="btn btn-outline-primary btn-accion" title="Ver detalles" th:attr="data-id=${usuario.id}" data-action="ver">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        <button class="btn btn-outline-warning btn-accion" title="Editar" th:attr="data-id=${usuario.id}" data-action="editar">
                                            <i class="fas fa-pen"></i>
                                        </button>
                                        <button class="btn btn-outline-danger btn-eliminar" title="Eliminar"
                                                th:data-usuario-id="${usuario.id}"
                                                th:data-usuario-nombre="${usuario.usuario}">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo Usuario -->
    <div class="modal fade" id="nuevoUsuarioModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-user-plus me-2"></i>Nuevo Usuario
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/usuarios}" method="post" id="formNuevoUsuario">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre de Usuario *</label>
                                <input type="text" class="form-control" name="usuario" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo Electrónico *</label>
                                <input type="email" class="form-control" name="correo" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contraseña *</label>
                                <input type="password" class="form-control" name="contrasena" required minlength="6">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Confirmar Contraseña *</label>
                                <input type="password" class="form-control" name="confirmPassword" required minlength="6">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Rol *</label>
                                <select class="form-select" name="role" required>
                                    <option value="">Seleccionar rol...</option>
                                    <option value="USER">Usuario</option>
                                    <option value="VETERINARIO">Veterinario</option>
                                    <option value="ADMIN">Administrador</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Estado</label>
                                <select class="form-select" name="active">
                                    <option value="true" selected>Activo</option>
                                    <option value="false">Inactivo</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-check me-1"></i>Crear Usuario
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Ver Usuario -->
    <div class="modal fade" id="verUsuarioModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-user me-2"></i>Detalles del Usuario
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detallesUsuario">
                    <!-- Contenido cargado dinámicamente -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.6/js/dataTables.bootstrap5.min.js"></script>
        <script src="/static/js/ui.js"></script>

    <script th:inline="none">
        $(document).ready(function() {
            // Inicializar DataTable
            const table = $('#tablaUsuarios').DataTable({
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
                },
                pageLength: 10,
                responsive: true,
                order: [[0, 'desc']]
            });

            // Buscar (búsqueda global)
            $('#buscarUsuario').on('keyup', function() {
                table.search(this.value).draw();
            });

            // Filtros por columna (rol y estado)
            $('#filtroRol, #filtroEstado').on('change', function() {
                const rol = $('#filtroRol').val();
                const estado = $('#filtroEstado').val();
                table.columns(3).search(rol).columns(4).search(estado).draw();
            });

            // Validación de formulario (nombres de inputs en plantilla)
            $('#formNuevoUsuario').on('submit', function(e) {
                const password = $('input[name="contrasena"]').val();
                const confirmPassword = $('input[name="confirmPassword"]').val();

                if (password !== confirmPassword) {
                    e.preventDefault();
                    alert('Las contraseñas no coinciden');
                    return false;
                }
            });

            // Contador de filas visibles
            function updateCounter() {
                const count = table.rows({ filter: 'applied' }).count();
                $('#contadorUsuarios').text(count);
            }

            // Actualizar contador cuando la tabla se dibuja
            table.on('draw', updateCounter);
            updateCounter();

            // Delegación para botones eliminar (funciona con DataTables y filas dinámicas)
            $('#tablaUsuarios').on('click', '.btn-eliminar', function() {
                const id = $(this).data('usuario-id');
                const nombre = $(this).data('usuario-nombre');
                eliminarUsuario(id, nombre);
            });
        });

        function limpiarFiltros() {
            $('#buscarUsuario').val('');
            $('#filtroRol').val('');
            $('#filtroEstado').val('');
            $('#tablaUsuarios').DataTable().search('').columns().search('').draw();
        }

        function verUsuario(id) {
            fetch(`/api/usuarios/${id}`)
                .then(response => {
                    if (!response.ok) throw new Error('Usuario no encontrado');
                    return response.json();
                })
                .then(data => {
                    const rolNombre = data.rol ? data.rol.nombre : 'Sin rol';
                    const content = `
                        <div class="row">
                            <div class="col-sm-4"><strong>ID:</strong></div>
                            <div class="col-sm-8">${data.id}</div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-sm-4"><strong>Usuario:</strong></div>
                            <div class="col-sm-8">${data.usuario}</div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-sm-4"><strong>Correo:</strong></div>
                            <div class="col-sm-8">${data.correo}</div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-sm-4"><strong>Nombre:</strong></div>
                            <div class="col-sm-8">${data.nombre || ''} ${data.apellido || ''}</div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-sm-4"><strong>DNI:</strong></div>
                            <div class="col-sm-8">${data.dni || ''}</div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-sm-4"><strong>Rol:</strong></div>
                            <div class="col-sm-8"><span class="badge bg-info">${rolNombre}</span></div>
                        </div>
                        <div class="row mt-2">
                            <div class="col-sm-4"><strong>Estado:</strong></div>
                            <div class="col-sm-8"><span class="badge bg-success">Activo</span></div>
                        </div>
                    `;
                    document.getElementById('detallesUsuario').innerHTML = content;
                    new bootstrap.Modal(document.getElementById('verUsuarioModal')).show();
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error al cargar los detalles del usuario');
                });
        }

        function editarUsuario(id) {
            window.location.href = `/usuarios/${id}/editar`;
        }

        function eliminarUsuario(id, nombre) {
            if (confirm(`¿Estás seguro de que deseas eliminar al usuario "${nombre}"?`)) {
                // Read CSRF token/header from meta tags added in head fragment
                const csrfToken = document.querySelector('meta[name="_csrf"]') ? document.querySelector('meta[name="_csrf"]').getAttribute('content') : null;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]') ? document.querySelector('meta[name="_csrf_header"]').getAttribute('content') : 'X-CSRF-TOKEN';

                const headers = {};
                if (csrfToken) headers[csrfHeader] = csrfToken;

                fetch(`/api/usuarios/${id}`, {
                    method: 'DELETE',
                    headers: headers
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    } else if (response.status === 403) {
                        alert('Acceso denegado: token CSRF faltante o inválido. Vuelve a iniciar sesión.');
                    } else {
                        alert('Error al eliminar el usuario');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error al eliminar el usuario');
                });
            }
        }
        // Registrar acciones locales en el registry global (nombres cortos y largos para compatibilidad)
        if (typeof registerAction === 'function') {
            try {
                // Nombres cortos (canónicos)
                registerAction('ver', verUsuario);
                registerAction('editar', editarUsuario);
                // Nombres largos por compatibilidad con plantillas antiguas
                registerAction('verUsuario', verUsuario);
                registerAction('editarUsuario', editarUsuario);
                // Registro de eliminación por nombre por si alguna parte usa data-action
                registerAction('eliminarUsuario', eliminarUsuario);
            } catch(e) { console.warn('Registro de acciones usuarios falló', e); }
        }
    </script>

    <div th:replace="~{fragments/toasts :: toasts}"></div>
    <div th:replace="~{fragments/modals :: modals}"></div>

    <!-- Styles moved to theme.css -->
</body>
</html>
