<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head(pageTitle='Iniciar Sesión - Garritas Veterinaria')}"></th:block>
</head>
<body class="page-login">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="login-container row g-0">
                    <!-- Logo Section -->
                        <div class="col-md-6 logo-section d-flex flex-column justify-content-center align-items-center p-5">
                        <i class="fas fa-heart paw-icon"></i>
                        <h2 class="text-center fw-bold mb-3">Garritas Veterinaria</h2>
                        <p class="text-center opacity-75">Cuidando a tus mejores amigos con amor y profesionalismo</p>
                        <div class="mt-4">
                            <div class="d-flex align-items-center mb-2">
                                <i class="fas fa-clock me-2"></i>
                                <small>Atención 24/7 para emergencias</small>
                            </div>
                            <div class="d-flex align-items-center mb-2">
                                <i class="fas fa-map-marker-alt me-2"></i>
                                <small>Av. Principal 123, Lima</small>
                            </div>
                            <div class="d-flex align-items-center">
                                <i class="fas fa-phone me-2"></i>
                                <small>+51 1 999-8888</small>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Login Form Section -->
                    <div class="col-md-6 p-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-dark">Iniciar Sesión</h3>
                            <p class="text-muted">Accede a tu cuenta para gestionar la clínica</p>
                        </div>
                        
                        <!-- Mensajes: ahora via toasts -->
                        <th:block th:if="${param.error}">
                            <script th:inline="javascript">
                                /*<![CDATA[*/
                                showToast('Error de autenticación', 'Usuario o contraseña incorrectos.', 'error');
                                /*]]>*/
                            </script>
                        </th:block>
                        <th:block th:if="${param.success}">
                            <script th:inline="javascript">
                                /*<![CDATA[*/
                                showToast('Éxito', /*[[${param.success}]]*/ 'Operación exitosa', 'success');
                                /*]]>*/
                            </script>
                        </th:block>
                        
                        <form th:action="@{/login}" method="post" id="loginForm">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <div th:replace="~{fragments/form-fields :: inputIcon('Usuario', 'username', '', 'text', 'fas fa-user', 'Ingresa tu usuario', false)}"></div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-lock me-2"></i>Contraseña
                                </label>
                                <div class="input-group">
                                    <input type="password" class="form-control form-control-lg" name="password" 
                                           placeholder="Ingresa tu contraseña" required autocomplete="current-password"
                                           id="passwordInput">
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="fas fa-eye" id="passwordIcon"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" name="remember" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    Recordarme en este dispositivo
                                </label>
                            </div>
                            
                            <button type="submit" class="btn btn-success btn-login w-100 mb-3">
                                <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                            </button>
                            
                            <div class="text-center">
                                <a href="#" class="text-decoration-none text-muted small">
                                    <i class="fas fa-question-circle me-1"></i>¿Olvidaste tu contraseña?
                                </a>
                            </div>
                        </form>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <p class="text-muted small mb-2">¿Necesitas acceso?</p>
                            <a href="mailto:admin@garritasveterinaria.com" class="btn btn-outline-secondary btn-sm">
                                <i class="fas fa-envelope me-1"></i>Contactar Administrador
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('passwordInput');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.classList.remove('fa-eye');
                passwordIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordIcon.classList.remove('fa-eye-slash');
                passwordIcon.classList.add('fa-eye');
            }
        });

        // Form validation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = this.username.value.trim();
            const password = this.password.value.trim();
            
            if (!username || !password) {
                e.preventDefault();
                alert('Por favor, completa todos los campos requeridos.');
                return false;
            }
        });

        // Auto-focus on first input
        document.querySelector('input[name="username"]').focus();
    </script>

    <div th:replace="~{fragments/toasts :: toasts}"></div>
    <div th:replace="~{fragments/modals :: modals}"></div>
</body>
</html>
