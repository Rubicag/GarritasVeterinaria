# Para desarrollo local, puedes usar MailHog (localhost:1025) o Mailtrap
#spring.mail.host=localhost
#spring.mail.port=1025

# Configuración de upload de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Limitar el patrón de recursos estáticos para evitar conflictos con rutas de controlador
spring.mvc.static-path-pattern=/static/**
# Servir estáticos solo desde /static/ dentro del classpath
spring.web.resources.static-locations=classpath:/static/
